const BASE={"hero":{"badge":"Cybersecurity • Artificial Intelligence • Network Engineering","name":"Idris Olanrewaju Ibraheem, M.Sc.","title":"Lecturer II in Computer Science | Ph.D. Candidate","affiliation":"Department of Cybersecurity, College of Computing, Fountain University, Osogbo, Nigeria","orcid":"0009-0002-3677-2478","email":"ibraheem.idris@fuo.edu.ng","phone":"+234 (0) 812 519 1913"},"bios":{"homeBioParagraphs":["Welcome—I’m Idris Olanrewaju Ibraheem, a Nigerian cybersecurity researcher, network engineer, and Lecturer II in the Department of Cybersecurity at Fountain University, Osogbo. Currently pursuing my Ph.D. in Computer Science at Al-Hikmah University, Ilorin, my work lives at the intersection of applied Artificial Intelligence, enterprise IT infrastructure, and academic mentorship.","Over the past 15+ years, I have combined hands-on industry operations with university teaching. Before transitioning into my full-time faculty role at Fountain University, I served as a Senior Network Analyst, Network Analyst, IT Officer, and Adjunct Lecturer at Al-Hikmah University, Ilorin, as well as an Assistant Lecturer at Abdulraheem College of Advanced Studies.","At Fountain University, I lead the Idris Olanrewaju Ibraheem Lab, focusing on practical, explainable, and resilient AI-driven defenses—spanning intrusion detection systems, cloud security, insider threat analytics, and healthcare risk prediction."],"academicBioParagraphs":["Idris Olanrewaju Ibraheem (born May 14 in Agege, Lagos State; indigenously from Epe LGA, Lagos State) is a Nigerian cybersecurity specialist, network engineer, and academic researcher serving as a Lecturer II in the Department of Cybersecurity, College of Computing at Fountain University, Osogbo, Osun State.","He holds an M.Sc. in Computer Science (2022) and a B.Sc. in Computer Science (2019) from Al-Hikmah University, Ilorin, alongside an HND (2013) and ND (2010) in Computer Science from Umaru Ali Shinkafi Polytechnic, Sokoto. He is currently completing his Ph.D. in Computer Science at Al-Hikmah University, Ilorin, investigating the 'Development of a Secure Maternal Health Risk Prediction and Monitoring Model Using LightGBM-SHAP' under Assoc. Prof. Abdulrauf Tosho. In 2022, he won the Departmental Best Innovative M.Sc. Dissertation Prize at Al-Hikmah University.","At Fountain University, he teaches undergraduate courses, leads the Idris Olanrewaju Ibraheem Lab, and serves as Departmental SIWES Coordinator, Member of the Undergraduate Curriculum Committee, Quality Assurance Committee, and College Research & Innovation Committee. Previously, he held dual academic and IT leadership roles at Al-Hikmah University (2017–2025), Abdulraheem College (2020–2025), Kadmus Global Services Abuja (2015–2017), Polio Emergency Operation Center Sokoto (2015), and Usmanu Danfodiyo University Sokoto (2008–2013)."],"speakerBio":"Idris Olanrewaju Ibraheem, M.Sc. is a Nigerian cybersecurity specialist, network engineer, and Lecturer II in the Department of Cybersecurity at Fountain University, Osogbo. Currently a Ph.D. candidate in Computer Science at Al-Hikmah University, Ilorin, he brings over 15 years of combined enterprise IT infrastructure and academic experience to his role. Winner of the 2022 Best Innovative M.Sc. Dissertation Prize, his research applies machine learning and explainable AI to intrusion detection, cloud security, insider threat analytics, and healthcare risk modeling. He holds certifications across Cisco, ISC2, IBM, Microsoft, Fortinet, and MikroTik, and serves as a YALI Community Lead and Hult Prize Volunteer Judge.","quickFacts":["Birthday: May 14 (Born in Agege, Lagos State)","Origin: Epe LGA, Lagos State, Nigeria","Languages: English, Yoruba, Hausa, Arabic","Honors: Best Innovative M.Sc. Dissertation Prize (2022)","Affiliations: IAENG, Africa's Young Entrepreneurs, YALI Community Lead","Family & Interests: Married with three children; Technology research, reading, aerobics"]},"publications":
